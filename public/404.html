<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070a" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
    />
    <title>404 · Lucas de Oliveira</title>
    <style>
      :root {
        --color-bg: #07070a;
        --color-gold: #c9a84c;
        --color-gold-light: #e8c97a;
        --color-gold-dim: #7a6128;
        --color-text-primary: #f2ead0;
        --color-text-secondary: #c9c2ae;
        --font-heading: "Cinzel", serif;
        --font-body: "Cormorant Garamond", serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        background: var(--color-bg);
        color: var(--color-text-primary);
        font-family: var(--font-body);
        display: grid;
        place-items: center;
        padding: 40px 6vw;
        overflow-x: hidden;
      }

      .lost {
        position: relative;
        display: grid;
        justify-items: center;
        text-align: center;
      }

      .lost__aura {
        position: absolute;
        top: 0;
        left: 50%;
        width: min(560px, 120vw);
        aspect-ratio: 1;
        translate: -50% 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 40%,
          rgba(201, 168, 76, 0.16) 0%,
          rgba(110, 80, 150, 0.1) 32%,
          rgba(7, 7, 10, 0) 68%
        );
        filter: blur(8px);
        pointer-events: none;
        animation: breath 9s ease-in-out infinite alternate;
      }

      .lost__figure {
        position: relative;
        width: min(340px, 72vw);
        animation: float 7s ease-in-out infinite alternate;
      }

      .lost__figure img {
        display: block;
        width: 100%;
        height: auto;
        /* dissolve a base e as laterais (o manto original é cortado nas bordas) */
        mask-image:
          linear-gradient(to bottom, #000 60%, transparent 95%),
          linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
        mask-composite: intersect;
      }

      .lost__ring {
        position: absolute;
        left: 50.5%;
        top: 61.9%;
        width: clamp(14px, 4.4%, 20px);
        aspect-ratio: 1;
        translate: -50% -50%;
        perspective: 120px;
      }

      .lost__ring-glow {
        position: absolute;
        inset: -260%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 196, 92, 0.55) 0%,
          rgba(201, 120, 40, 0.22) 22%,
          rgba(201, 168, 76, 0) 60%
        );
        mix-blend-mode: screen;
        animation: pulse 3.2s ease-in-out infinite;
      }

      .lost__ring svg {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 3px rgba(255, 210, 120, 0.9))
          drop-shadow(0 0 8px rgba(232, 160, 60, 0.6));
        animation: spin 4.5s linear infinite;
      }

      .lost__code {
        position: relative;
        margin-top: -30px;
        font-family: var(--font-heading);
        font-size: 12px;
        letter-spacing: 6px;
        color: var(--color-gold);
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .lost__code::before,
      .lost__code::after {
        content: "";
        width: 36px;
        height: 1px;
        background: var(--color-gold-dim);
      }

      .lost__title {
        margin-top: 16px;
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: clamp(26px, 5vw, 38px);
        letter-spacing: 1px;
      }

      .lost__text {
        margin-top: 12px;
        max-width: 34ch;
        font-style: italic;
        font-size: clamp(17px, 2.4vw, 20px);
        color: var(--color-text-secondary);
      }

      .lost__back {
        margin-top: 32px;
        padding: 14px 32px;
        font-family: var(--font-heading);
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--color-bg);
        background: var(--color-gold);
        border: 1px solid var(--color-gold);
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      .lost__back:hover,
      .lost__back:focus-visible {
        background: transparent;
        color: var(--color-gold-light);
      }

      .lost__back:focus-visible {
        outline: 1px solid var(--color-gold-light);
        outline-offset: 4px;
      }

      @keyframes spin {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.65;
          scale: 0.9;
        }
        50% {
          opacity: 1;
          scale: 1.1;
        }
      }

      @keyframes float {
        from {
          translate: 0 0;
        }
        to {
          translate: 0 -10px;
        }
      }

      @keyframes breath {
        from {
          opacity: 0.7;
          scale: 0.96;
        }
        to {
          opacity: 1;
          scale: 1.04;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="lost">
      <div class="lost__aura" aria-hidden="true"></div>

      <div class="lost__figure" aria-hidden="true">
        <img src="/wraith.webp" alt="" width="828" height="855" />
        <div class="lost__ring">
          <span class="lost__ring-glow"></span>
          <svg viewBox="0 0 100 100">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f6dc8e" />
                <stop offset="45%" stop-color="#c9a84c" />
                <stop offset="70%" stop-color="#7a5a1c" />
                <stop offset="100%" stop-color="#e8c97a" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold)" stroke-width="11" />
            <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,240,200,0.55)" stroke-width="1.2" />
          </svg>
        </div>
      </div>

      <p class="lost__code">404</p>
      <h1 class="lost__title" data-i18n="title">You have wandered into the shadows</h1>
      <p class="lost__text" data-i18n="text">
        This path leads nowhere. Even the wraith could not find what you were looking for.
      </p>
      <a class="lost__back" href="/" data-i18n="back">Return to the light</a>
    </main>

    <script>
      // mesma lógica de idioma do site: ?lang=, localStorage, depois navegador
      (function () {
        var TEXTS = {
          pt: {
            title: "Você se perdeu nas sombras",
            text: "Este caminho não leva a lugar algum. Nem a sombra encontrou o que você procurava.",
            back: "Voltar para a luz",
          },
        };

        var lang = new URLSearchParams(location.search).get("lang");
        if (!lang) {
          try {
            lang = localStorage.getItem("lang");
          } catch (e) {
            lang = null;
          }
        }
        if (!lang) lang = (navigator.language || "").slice(0, 2).toLowerCase();

        if (lang !== "pt") return;

        document.documentElement.lang = "pt-BR";
        document.title = "404 · Lucas de Oliveira";
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          el.textContent = TEXTS.pt[el.getAttribute("data-i18n")];
        });
      })();
    </script>
  </body>
</html>
